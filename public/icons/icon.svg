<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0d18"/>
      <stop offset="100%" stop-color="#131325"/>
    </linearGradient>
    <linearGradient id="lock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b9eff"/>
      <stop offset="100%" stop-color="#1a6fd4"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- Circuit traces -->
  <line x1="40"  y1="130" x2="110" y2="130" stroke="#1e2a4a" stroke-width="2.5"/>
  <line x1="402" y1="130" x2="472" y2="130" stroke="#1e2a4a" stroke-width="2.5"/>
  <line x1="40"  y1="382" x2="110" y2="382" stroke="#1e2a4a" stroke-width="2.5"/>
  <line x1="402" y1="382" x2="472" y2="382" stroke="#1e2a4a" stroke-width="2.5"/>
  <line x1="80"  y1="160" x2="80"  y2="220" stroke="#1e2a4a" stroke-width="2.5"/>
  <line x1="432" y1="160" x2="432" y2="220" stroke="#1e2a4a" stroke-width="2.5"/>
  <line x1="80"  y1="292" x2="80"  y2="352" stroke="#1e2a4a" stroke-width="2.5"/>
  <line x1="432" y1="292" x2="432" y2="352" stroke="#1e2a4a" stroke-width="2.5"/>

  <!-- Circuit dots -->
  <circle cx="80"  cy="130" r="5" fill="#243050"/>
  <circle cx="432" cy="130" r="5" fill="#243050"/>
  <circle cx="80"  cy="382" r="5" fill="#243050"/>
  <circle cx="432" cy="382" r="5" fill="#243050"/>

  <!-- Glowing accent nodes -->
  <circle cx="80"  cy="220" r="7" fill="#3b9eff" opacity="0.55"/>
  <circle cx="432" cy="220" r="7" fill="#3b9eff" opacity="0.55"/>
  <circle cx="80"  cy="292" r="7" fill="#3b9eff" opacity="0.55"/>
  <circle cx="432" cy="292" r="7" fill="#3b9eff" opacity="0.55"/>

  <!-- Lock shackle -->
  <path d="M 196 188
           C 196 118, 316 118, 316 188
           L 316 224
           L 284 224
           L 284 194
           C 284 158, 228 158, 228 194
           L 228 224
           L 196 224
           Z"
    fill="url(#lock)"/>

  <!-- Lock body -->
  <rect x="152" y="220" width="208" height="168" rx="24" fill="url(#lock)"/>

  <!-- Lock body shine -->
  <rect x="152" y="220" width="208" height="84" rx="24" fill="url(#shine)"/>

  <!-- Keyhole circle -->
  <circle cx="256" cy="292" r="30" fill="#0a0d20"/>

  <!-- Keyhole slot -->
  <rect x="244" y="308" width="24" height="38" rx="7" fill="#0a0d20"/>

  <!-- Lock body border -->
  <rect x="152" y="220" width="208" height="168" rx="24" fill="none" stroke="#5ab4ff" stroke-width="1.5" stroke-opacity="0.2"/>

  <!-- Outer icon border -->
  <rect width="512" height="512" rx="110" fill="none" stroke="#3b9eff" stroke-width="2" stroke-opacity="0.25"/>
</svg>
